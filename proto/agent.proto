syntax = "proto3";

package biryani.agent;

service Agent {
  rpc GetMetrics(Empty) returns (MetricsResponse);
  rpc ListContainers(Empty) returns (ContainerList);
  rpc StartContainer(ContainerRequest) returns (StatusResponse);
  rpc StopContainer(ContainerRequest) returns (StatusResponse);
  rpc GetContainerLogs(LogRequest) returns (LogsResponse);
  rpc Heartbeat(Empty) returns (HeartbeatResponse);
}

message Empty {}

message MetricsResponse {
  double cpu_percent = 1;
  uint64 memory_total = 2;
  uint64 memory_used = 3;
  double memory_percent = 4;
  int32 containers_running = 5;
  int32 containers_total = 6;
}

message Container {
  string id = 1;
  string name = 2;
  string image = 3;
  string status = 4;
}

message ContainerList {
  repeated Container containers = 1;
}

message ContainerRequest {
  string container_id = 1;
}

message StatusResponse {
  bool success = 1;
  string error = 2;
}

message LogRequest {
  string container_id = 1;
  int32 tail = 2;
}

message LogsResponse {
  string output = 1;
}

message HeartbeatResponse {
  bool online = 1;
  string name = 2;
  int64 timestamp = 3;
}
