networks:
  servernest:
    driver: bridge

services:
  api:
    container_name: servernest-api
    build:
      context: .
      target: api-runtime
    restart: unless-stopped
    networks:
      - servernest
    ports:
      - "${API_PORT:-3001}:3001"
      - "${SERVER_PORT_RANGE_START:-25565}-${SERVER_PORT_RANGE_END:-25665}:25565-25665"
    environment:
      - NODE_ENV=production
      - API_PORT=3001
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DATABASE_PATH=/app/data/servernest.db
      - DOCKER_IMAGE=itzg/minecraft-server
      - SERVER_PORT_RANGE_START=25565
      - SERVER_PORT_RANGE_END=25665
    volumes:
      - servernest-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock # WARNING: Grants container root access to host Docker daemon. Use rootless Docker or a socket proxy in production.
    # The container runs as the non-root `servernest` user, but the Docker socket
    # is typically root:root 660, so it is unreadable without a matching
    # supplementary group. Default 0 works on stock Docker/Docker Desktop; set
    # DOCKER_GID in .env to your host's socket group (e.g. `stat -c '%g'
    # /var/run/docker.sock`) to avoid granting group 0.
    group_add:
      - "${DOCKER_GID:-0}"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
          pids: 512
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    container_name: servernest-web
    build:
      context: .
      target: web-runtime
      args:
        # Next bakes rewrites() into routes-manifest.json at build time, so the
        # proxy target has to be known here. "api" is the compose service name,
        # resolvable on the shared bridge network.
        API_HOST: api
        API_PORT: "3001"
    restart: unless-stopped
    networks:
      - servernest
    ports:
      - "${PANEL_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - API_HOST=api
      - API_PORT=3001
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

volumes:
  servernest-data:
