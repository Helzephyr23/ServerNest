networks:
  biryani:
    driver: bridge

services:
  api:
    container_name: biryani-api
    build:
      context: .
      target: api-runtime
    restart: unless-stopped
    networks:
      - biryani
    ports:
      - "${API_PORT:-3001}:3001"
      - "${SERVER_PORT_RANGE_START:-25565}-${SERVER_PORT_RANGE_END:-25665}:25565-25665"
    environment:
      - NODE_ENV=production
      - API_PORT=3001
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DATABASE_PATH=/app/data/biryani.db
      - DOCKER_IMAGE=itzg/minecraft-server
      - SERVER_PORT_RANGE_START=25565
      - SERVER_PORT_RANGE_END=25665
    volumes:
      - biryani-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock # WARNING: Grants container root access to host Docker daemon. Use rootless Docker or a socket proxy in production.
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
          pids: 512
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    container_name: biryani-web
    build:
      context: .
      target: web-runtime
      args:
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-}
    restart: unless-stopped
    networks:
      - biryani
    ports:
      - "${PANEL_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - API_HOST=api
      - API_PORT=3001
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

volumes:
  biryani-data:
