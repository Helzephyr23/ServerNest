services:
  biryani:
    container_name: biryani
    build: .
    restart: unless-stopped
    ports:
      - "${PANEL_PORT:-3000}:3000"
      - "${API_PORT:-3001}:3001"
      - "${SERVER_PORT_RANGE_START:-25565}-${SERVER_PORT_RANGE_END:-25665}:25565-25665"
    environment:
      - NODE_ENV=production
      - PANEL_HOST=0.0.0.0
      - PANEL_PORT=3000
      - API_PORT=3001
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DATABASE_PATH=/app/data/biryani.db
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:3001
      - DOCKER_IMAGE=itzg/minecraft-server
      - SERVER_PORT_RANGE_START=25565
      - SERVER_PORT_RANGE_END=25665
    volumes:
      - biryani-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  biryani-data:
