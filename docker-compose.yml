services:
  api:
    container_name: biryani-api
    build:
      context: .
      target: api-runtime
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
      - "${SERVER_PORT_RANGE_START:-25565}-${SERVER_PORT_RANGE_END:-25665}:25565-25665"
    environment:
      - NODE_ENV=production
      - API_PORT=3001
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DATABASE_PATH=/app/data/biryani.db
      - DOCKER_IMAGE=itzg/minecraft-server
      - SERVER_PORT_RANGE_START=25565
      - SERVER_PORT_RANGE_END=25665
    volumes:
      - biryani-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

  web:
    container_name: biryani-web
    build:
      context: .
      target: web-runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:3001}
    restart: unless-stopped
    ports:
      - "${PANEL_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - api

volumes:
  biryani-data:
